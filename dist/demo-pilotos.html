<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Viaje · 3D pilotos</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://www.viaje.com.ve/demo-pilotos" />
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#0a1322; font-family:"Poppins",system-ui,sans-serif; }
  #c{ position:fixed; inset:0; display:block; }
  #load{ position:fixed; inset:0; display:grid; place-items:center; z-index:5; color:#9fb2cf; font-size:14px; background:#0a1322; }
  #load .spin{ width:30px; height:30px; border:3px solid rgba(255,255,255,.15); border-top-color:#1E88E5; border-radius:999px; animation:sp 1s linear infinite; margin:0 auto 12px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .tag{ position:fixed; left:16px; top:16px; z-index:3; display:inline-flex; align-items:center; gap:7px; padding:7px 13px;
    border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(10px);
    color:#dce6f5; font-size:12px; font-weight:600; pointer-events:none; }
  .dot{ width:7px; height:7px; border-radius:999px; background:#34D399; box-shadow:0 0 10px #34D399; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div style="text-align:center"><div class="spin"></div>Cargando…</div></div>
<span class="tag"><span class="dot"></span>Tu carro · tu ruta · tus ingresos</span>
<script>
addEventListener('error', ev => {
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:12px;bottom:12px;right:12px;z-index:99;color:#ff8585;background:rgba(30,10,10,.94);border:1px solid #ff5252;border-radius:10px;font:12px/1.5 monospace;padding:12px;white-space:pre-wrap;max-height:50vh;overflow:auto';
  d.textContent='ERROR 3D:\n'+(ev.message||ev.error)+'\n'+(ev.filename||'')+':'+(ev.lineno||'');
  document.body.appendChild(d);
  const l=document.getElementById('load'); if(l) l.style.display='none';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
if (typeof THREE === 'undefined') throw new Error('Three.js no cargó');
if (typeof THREE.GLTFLoader === 'undefined') throw new Error('GLTFLoader no cargó');

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1322, 40, 110);
const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, .1, 600);
camera.position.set(7.5, 3.8, 10);

const renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('c'), antialias:true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

const skyC=document.createElement('canvas'); skyC.width=8; skyC.height=256;
const sx=skyC.getContext('2d'); const sg=sx.createLinearGradient(0,0,0,256);
sg.addColorStop(0,'#2a4d80'); sg.addColorStop(.5,'#13294a'); sg.addColorStop(1,'#080f1c');
sx.fillStyle=sg; sx.fillRect(0,0,8,256);
const skyTex=new THREE.CanvasTexture(skyC); skyTex.mapping=THREE.EquirectangularReflectionMapping;
scene.background=skyTex;
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromEquirectangular(skyTex).texture;

scene.add(new THREE.HemisphereLight(0xaecdff,0x10203a,.8));
const sun=new THREE.DirectionalLight(0xfff2da,2.0); sun.position.set(-16,24,12); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-40; sun.shadow.camera.right=40; sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40; sun.shadow.bias=-0.0003;
scene.add(sun);

const target=new THREE.Vector3(0,1.0,0);
let radius=camera.position.distanceTo(target);
let theta=Math.atan2(camera.position.x-target.x, camera.position.z-target.z);
let phi=Math.acos((camera.position.y-target.y)/radius);
let tTheta=theta, tPhi=phi, tRadius=radius, dragging=false, autoRot=true, lx=0, ly=0;
const cvs=renderer.domElement; cvs.style.touchAction='none';
cvs.addEventListener('pointerdown', e=>{ dragging=true; autoRot=false; lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointermove', e=>{ if(!dragging) return; tTheta-=(e.clientX-lx)*.006; tPhi-=(e.clientY-ly)*.006; tPhi=Math.max(.5,Math.min(1.35,tPhi)); lx=e.clientX; ly=e.clientY; });
cvs.addEventListener('wheel', e=>{ e.preventDefault(); tRadius=Math.max(7,Math.min(20,tRadius+e.deltaY*.02)); }, {passive:false});
function updateCam(){ if(autoRot) tTheta+=.0016; theta+=(tTheta-theta)*.08; phi+=(tPhi-phi)*.08; radius+=(tRadius-radius)*.08;
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta), target.y+radius*Math.cos(phi), target.z+radius*Math.sin(phi)*Math.cos(theta)); camera.lookAt(target); }

const road=new THREE.Group(); scene.add(road);
const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(220,11), new THREE.MeshStandardMaterial({color:0x12161d, roughness:.95}));
asphalt.rotation.x=-Math.PI/2; asphalt.receiveShadow=true; road.add(asphalt);
[-1,1].forEach(s=>{ const side=new THREE.Mesh(new THREE.BoxGeometry(220,.3,5), new THREE.MeshStandardMaterial({color:0x2b3340, roughness:.9})); side.position.set(0,.15,s*8); side.receiveShadow=true; side.castShadow=true; road.add(side); });
[-1,1].forEach(s=>{ const ln=new THREE.Mesh(new THREE.PlaneGeometry(220,.18), new THREE.MeshStandardMaterial({color:0xd8dee8, roughness:.6})); ln.rotation.x=-Math.PI/2; ln.position.set(0,.02,s*5); road.add(ln); });
const dashes=[]; const dashMat=new THREE.MeshStandardMaterial({color:0xe8c34a, emissive:0x5a4410, emissiveIntensity:.25, roughness:.6});
for(let i=0;i<40;i++){ const d=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.3), dashMat); d.rotation.x=-Math.PI/2; d.position.set(-100+i*5,.03,0); road.add(d); dashes.push(d); }
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.MeshStandardMaterial({color:0x0b1320, roughness:1}));
ground.rotation.x=-Math.PI/2; ground.position.y=-.02; ground.receiveShadow=true; scene.add(ground);

function fitGround(obj, targetMax){ const box=new THREE.Box3().setFromObject(obj); const size=new THREE.Vector3(); box.getSize(size);
  const s=targetMax/Math.max(size.x,size.y,size.z); obj.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(obj); const c=new THREE.Vector3(); b2.getCenter(c);
  obj.position.x-=c.x; obj.position.z-=c.z; obj.position.y-=b2.min.y; }
function shadows(obj){ obj.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; if(n.material) n.material.envMapIntensity=1.1; } }); }

const loader=new THREE.GLTFLoader();
const draco=new THREE.DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
loader.setDRACOLoader(draco);
const load=url=>new Promise((res,rej)=> loader.load(url, g=>res(g), undefined, rej));
const buildings=[]; let carWrap=null;
(async function(){
  const carGltf=await load('/models/volvo/scene-draco.glb'); const car=carGltf.scene;
  car.rotation.y=-Math.PI/2; fitGround(car,4.8); shadows(car);
  carWrap=new THREE.Group(); carWrap.add(car); scene.add(carWrap);
  const bGltf=await load('/models/edificio/scene-draco.glb'); const proto=bGltf.scene;
  fitGround(proto,16); shadows(proto);
  for(let i=0;i<14;i++){ const side=i%2?1:-1; const b=proto.clone(true); b.scale.multiplyScalar(.7+Math.random()*.8);
    b.position.set(-90+i*13+Math.random()*4,0,side*(13+Math.random()*6)); b.rotation.y=side>0?Math.PI:0; scene.add(b); buildings.push(b); }
  document.getElementById('load').style.display='none';
})().catch(err=>{ throw err; });

let t=0;
function animate(){ requestAnimationFrame(animate); t+=.016; const speed=.4;
  dashes.forEach(d=>{ d.position.x-=speed; if(d.position.x<-100) d.position.x+=40*5; });
  buildings.forEach(b=>{ b.position.x-=speed; if(b.position.x<-95) b.position.x+=14*13; });
  if(carWrap){ carWrap.position.y=Math.sin(t*3)*.03; carWrap.rotation.z=Math.sin(t*1.6)*.008; }
  updateCam(); renderer.render(scene,camera); }
animate();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
